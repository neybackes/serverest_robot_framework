name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  robot-tests:
    runs-on: ubuntu-latest
    env:
      API_BASE_URL: http://127.0.0.1:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          poetry install

      - name: Install and start ServeRest
        run: |
          npm install -g serverest
          nohup serverest > serverest.log 2>&1 &

      - name: Wait for API
        run: |
          for i in {1..20}; do
            curl -fsS "$API_BASE_URL/usuarios" && exit 0
            sleep 2
          done
          exit 1

      - name: Run Robot
        run: poetry run robot -d reports tests/
